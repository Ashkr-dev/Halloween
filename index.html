<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/OG/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/OG/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spooky Graveyard</title>

    <!-- 1. Primary Search Engine Meta Tags -->
    <meta
      name="description"
      content="Spooky Graveyard 3D interactive experience built with React Three Fiber & TSL."
    />
    <link rel="canonical" href="https://ash-halloween.vercel.app/" />
    <meta name="theme-color" content="#4285f4" />

    <!-- 2. Open Graph / Facebook Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ash-halloween.vercel.app/" />
    <meta property="og:site_name" content="Spooky Graveyard" />
    <meta property="og:title" content="Spooky Graveyard" />
    <meta
      property="og:description"
      content="Spooky Graveyard 3D interactive experience built with React Three Fiber & TSL."
    />
    <!-- FIXED: Turned into a absolute live URL -->
    <meta property="og:image" content="/OG/og-image.jpg" />
    <meta property="og:image:alt" content="Graveyard Image" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- 3. Twitter Tags -->
    <!-- FIXED: Standardized to use name attributes for Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://ash-halloween.vercel.app/" />
    <meta name="twitter:title" content="Spooky Graveyard" />
    <meta
      name="twitter:description"
      content="Spooky Graveyard 3D interactive experience built with React Three Fiber & TSL."
    />
    <!-- FIXED: Turned into a absolute live URL -->
    <meta name="twitter:image" content="/OG/og-image.jpg" />
    <meta name="twitter:image:alt" content="Graveyard Image" />
  </head>
  <body>
    <!-- Visually hidden h1 for search engines and accessibility bots -->
    <h1
      style="
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        border: 0;
      "
    >
      The Graveyard Halloween Project - 3D Interactive Experience
    </h1>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
